<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VI Offline Assets</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0EC; --card:#FFFFFF; --ink:#171A1E; --muted:#5B6470;
  --slate:#232B33; --slate2:#2E3A45; --line:#D8DCD6;
  --red:#C0392B; --red-bg:#F9E9E7; --amber:#C77F0A; --amber-bg:#FBF1DD;
  --orange:#C55A11; --orange-bg:#FAEBDE;
  --green:#2F7A4D; --green-bg:#E5F1E9; --hazard:#F2C230;
  --mono:'IBM Plex Mono',monospace; --sans:'Archivo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{background:var(--slate);color:#fff}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-weight:900;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.brand .sub{font-family:var(--mono);font-size:11px;color:#9FB0BE}
.hd-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid #46545F;background:transparent;color:#DDE5EA;padding:7px 12px;font-size:12px;font-weight:600;letter-spacing:.02em;border-radius:3px}
.btn:hover{background:#2E3A45}
.btn.primary{background:var(--hazard);border-color:var(--hazard);color:#171A1E}
.btn.primary:hover{background:#E5B41E}
.weekof{font-family:var(--mono);font-size:12px;color:#9FB0BE}
.modesw{display:inline-flex;border:1px solid #46545F;border-radius:3px;overflow:hidden}
.modesw button{background:transparent;border:none;color:#9FB0BE;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:7px 13px;font-family:var(--sans)}
.modesw button:hover{background:#2E3A45;color:#DDE5EA}
.modesw button.on{background:var(--hazard);color:#171A1E}
.weekof b{color:#fff}

/* ---------- triage strip ---------- */
.triage{background:var(--slate2);color:#fff;border-top:1px solid #3A4854}
.triage-in{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.t-block{padding:16px 26px 16px 0;margin-right:26px;border-right:1px solid #3A4854;cursor:pointer}
.t-block:last-child{border-right:none}
.t-block:hover .t-num{color:var(--hazard)}
.t-label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8FA1AF;display:flex;align-items:center;gap:6px}
.t-label .tag{background:var(--hazard);color:#171A1E;padding:1px 6px;border-radius:2px;letter-spacing:.1em}
.t-num{font-size:38px;font-weight:900;line-height:1.1;transition:color .12s}
.t-sub{font-family:var(--mono);font-size:11px;color:#9FB0BE;margin-top:2px}
.t-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-family:var(--mono);font-size:11px;background:#1B2229;border:1px solid #3A4854;color:#DDE5EA;padding:3px 8px;border-radius:2px}
.chip b{color:var(--hazard)}
.t-num.ok{color:#6FBF8E}

/* ---------- nav ---------- */
.nav{display:flex;gap:2px;padding:14px 0 0;flex-wrap:wrap}
.nav button{background:transparent;border:none;border-bottom:3px solid transparent;padding:8px 14px;font-size:13px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
.nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.nav button:hover{color:var(--ink)}
.nav .count{font-family:var(--mono);font-size:11px;margin-left:5px;background:var(--line);padding:1px 6px;border-radius:10px;color:var(--ink)}

/* ---------- main ---------- */
main{padding:20px 0 60px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px}
.card h2{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line)}

/* branch list */
.branch-row{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-bottom:1px solid #EFF1ED;cursor:pointer;gap:8px}
.branch-row:last-child{border-bottom:none}
.branch-row:hover{background:#F7F8F5}
.branch-row .nm{font-weight:600;font-size:13px}
.branch-row .meta{display:flex;align-items:center;gap:10px}
.branch-row .n{font-family:var(--mono);font-weight:600;font-size:13px;min-width:24px;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--slate2);min-width:2px}
.pk-dot{width:7px;height:7px;border-radius:50%;background:var(--hazard);display:inline-block;margin-left:6px}

/* table */
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th .arr{font-size:9px}
td{padding:9px 12px;border-bottom:1px solid #EFF1ED;vertical-align:middle}
tr.asset:hover td{background:#F7F8F5}
tr.asset{cursor:pointer}
.aid{font-family:var(--mono);font-weight:600;font-size:12.5px;white-space:nowrap}
.cust{font-size:13px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtag{font-family:var(--mono);font-weight:600;font-size:12px;padding:2px 8px;border-radius:2px;white-space:nowrap}
.d1{background:#EDEFEA;color:#4B5560}
.d2{background:var(--amber-bg);color:var(--amber)}
.d3{background:var(--orange-bg);color:var(--orange)}
.d4{background:var(--red-bg);color:var(--red)}
.pk-flag{background:var(--hazard);color:#171A1E;font-size:9px;font-weight:800;letter-spacing:.1em;padding:2px 5px;border-radius:2px;margin-left:6px;vertical-align:1px}
.rep-flag{background:var(--slate);color:#fff;font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 5px;border-radius:2px;margin-left:6px;vertical-align:1px}
.note-flag{color:var(--muted);font-size:11px;margin-left:6px}
.fixbtn{border:1px solid var(--line);background:#fff;color:var(--ink);font-size:11px;font-weight:700;padding:5px 10px;border-radius:3px;white-space:nowrap}
.fixbtn:hover{border-color:var(--green);color:var(--green)}
.fixbtn.done{background:var(--green);border-color:var(--green);color:#fff}
.tbl-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.tbl-hd h2{padding:0;border:none}
.tbl-hd input{border:1px solid var(--line);border-radius:3px;padding:6px 10px;font-family:var(--mono);font-size:12px;width:220px}
.tbl-hd .back{border:none;background:none;font-weight:700;font-size:12px;color:var(--muted);padding:0}
.tbl-hd .back:hover{color:var(--ink)}
.tally{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tally b{color:var(--ink)}
.tally .g{color:var(--green)}

/* detail drawer */
.overlay{position:fixed;inset:0;background:rgba(20,24,28,.45);display:none;z-index:40}
.overlay.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:94vw;background:#fff;z-index:41;transform:translateX(102%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer.on{transform:none}
.dw-hd{background:var(--slate);color:#fff;padding:18px 20px}
.dw-hd .aid{font-size:18px;color:#fff}
.dw-hd .c{font-size:13px;color:#BBC8D2;margin-top:2px}
.dw-hd .x{position:absolute;top:14px;right:16px;background:none;border:none;color:#9FB0BE;font-size:20px}
.dw-body{flex:1;overflow-y:auto;padding:18px 20px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:12.5px;margin-bottom:16px}
.kv .k{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding-top:1px}
.kv .v{font-family:var(--mono)}
.dw-sec{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.hist-item{padding:8px 10px;background:#F6F7F4;border-left:3px solid var(--line);margin-bottom:6px;font-size:12.5px}
.hist-item .ts{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block;margin-bottom:2px}
.hist-item.fix{border-left-color:var(--green)}
.hist-item.appear{border-left-color:var(--amber)}
.cbox{width:100%;border:1px solid var(--line);border-radius:3px;padding:8px 10px;font-family:inherit;font-size:13px;resize:vertical;min-height:60px}
.dw-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px}
.dw-foot .fixbtn{flex:1;padding:10px;font-size:13px}
.dw-foot .save{flex:1;border:1px solid var(--slate);background:var(--slate);color:#fff;font-weight:700;font-size:13px;border-radius:3px}

/* trends */
.mcards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:900px){.mcards{grid-template-columns:repeat(2,1fr)}}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;cursor:pointer;border-top:3px solid var(--line)}
.mcard:hover{background:#FBFCFA}
.mcard.on{outline:2px solid var(--slate)}
.mcard .n{font-size:30px;font-weight:900;line-height:1.1}
.mcard .l{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.mcard .s{font-size:11px;color:var(--muted);margin-top:4px}
.mcard.in{border-top-color:var(--red)}
.mcard.ret{border-top-color:var(--amber)}
.mcard.car{border-top-color:var(--slate)}
.mcard.clr{border-top-color:var(--green)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;margin-top:18px}
@media(max-width:1000px){.tgrid{grid-template-columns:1fr}}
.dotrow{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.wdot{width:10px;height:10px;border-radius:2px;background:#E3E6E0;border:1px solid var(--line)}
.wdot.on{background:var(--red);border-color:var(--red)}
.wdot.fx{background:var(--green);border-color:var(--green)}
.trend-arrow{font-weight:900}
/* empty / dropzone */
.drop{border:2px dashed #B9C0B7;border-radius:6px;padding:70px 30px;text-align:center;background:#F5F6F3;margin-top:24px;transition:border-color .12s,background .12s}
.drop.hot{border-color:var(--slate);background:#ECEFE9}
.drop h3{font-size:20px;font-weight:800;margin-bottom:8px}
.drop p{color:var(--muted);max-width:480px;margin:0 auto 18px}
.drop .btn2{background:var(--slate);color:#fff;border:none;padding:11px 22px;font-weight:700;font-size:13px;border-radius:3px}
.drop .fmt{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:14px}

.park-group{margin-bottom:6px}
.park-reason{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 16px 6px;display:flex;align-items:center;gap:8px}
.park-reason .ct{font-family:var(--mono);background:var(--line);padding:1px 7px;border-radius:10px;font-size:11px;color:var(--ink)}
.park-note{font-size:12px;color:var(--muted);padding:0 16px 6px;font-style:italic}
.park-btn{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:11px;font-weight:700;padding:5px 10px;border-radius:3px;white-space:nowrap}
.park-btn:hover{border-color:var(--amber);color:var(--amber)}
.park-btn.active{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.unpark-btn{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:11px;font-weight:700;padding:5px 10px;border-radius:3px;white-space:nowrap}
.unpark-btn:hover{border-color:var(--ink);color:var(--ink)}
.park-select{border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-family:inherit;font-size:12px;width:100%;margin-bottom:6px;background:#fff}
.park-note-input{width:100%;border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-family:inherit;font-size:12px;resize:vertical;min-height:44px;margin-bottom:8px}
.park-actions{display:flex;gap:6px;margin-top:6px}
.park-submit{border:none;background:var(--amber);color:#171A1E;font-weight:700;font-size:12px;padding:7px 14px;border-radius:3px;cursor:pointer}
.park-submit:hover{background:#B8740A}
.act-row{display:flex;align-items:baseline;padding:8px 16px;border-bottom:1px solid #EFF1ED;gap:12px;font-size:13px}
.act-row:last-child{border-bottom:none}
.act-row:hover{background:#F7F8F5}
.act-ts{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:118px}
.act-who{font-family:var(--mono);font-size:11.5px;font-weight:600;min-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-tag{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px;min-width:74px;text-align:center}
.act-fixed{background:var(--green-bg);color:var(--green)}
.act-reopened{background:var(--amber-bg);color:var(--amber)}
.act-note{background:#EDEFEA;color:#4B5560}
.act-parked{background:var(--orange-bg);color:var(--orange)}
.act-unparked{background:#EDEFEA;color:#4B5560}
.act-upload{background:#E4E9F2;color:#2E4A7D}
.act-signin{background:#F0F0EE;color:#7A8390}
.act-body{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-body .a{font-family:var(--mono);font-weight:600}
.act-body .d{color:var(--muted)}
.act-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.act-filters select{border:1px solid var(--line);border-radius:3px;padding:6px 10px;font-family:var(--mono);font-size:12px;background:#fff}
.by-tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block;margin-top:3px}
.w48-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:900px){.w48-cards{grid-template-columns:repeat(2,1fr)}}
.w48-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;border-top:3px solid var(--line)}
.w48-card .n{font-size:30px;font-weight:900;line-height:1.1}
.w48-card .l{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.w48-card .s{font-size:11px;color:var(--muted);margin-top:4px}
.w48-card.early{border-top-color:var(--red)}
.w48-card.tot{border-top-color:var(--slate)}
.w48-card.dq{border-top-color:var(--amber)}
.w48-card.park{border-top-color:var(--orange)}
.tag-early{background:var(--red-bg);color:var(--red);font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:2px;margin-left:6px}
.tag-dq{background:var(--amber-bg);color:var(--amber);font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:2px;margin-left:6px;cursor:help}
.tag-flag{background:var(--orange-bg);color:var(--orange);font-size:9px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:2px;margin-left:6px}
.loc{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.rpt-row{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid #EFF1ED;gap:14px}
.rpt-row:last-child{border-bottom:none}
.rpt-row:hover{background:#F7F8F5}
.rpt-wk{font-family:var(--mono);font-weight:600;font-size:13px;min-width:90px}
.rpt-fn{font-size:12px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpt-sz{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:60px;text-align:right}
.rpt-dl{border:1px solid var(--line);background:#fff;color:var(--ink);font-size:11px;font-weight:700;padding:5px 12px;border-radius:3px;text-decoration:none;white-space:nowrap}
.rpt-dl:hover{border-color:var(--slate);background:var(--slate);color:#fff}
.rpt-cur{background:var(--green-bg);font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--green);padding:2px 6px;border-radius:2px}
.warnbar{background:var(--red);color:#fff;padding:11px 20px;font-size:13px;display:none;align-items:flex-start;gap:12px}
.warnbar.on{display:flex}
.warnbar b{font-weight:800}
.warnbar .msg{flex:1;line-height:1.5}
.warnbar code{background:rgba(255,255,255,.18);padding:1px 6px;border-radius:2px;font-family:var(--mono);font-size:12px}
.warnbar .x{background:none;border:none;color:#fff;opacity:.7;font-size:18px;line-height:1;padding:0}
.warnbar .x:hover{opacity:1}
.progbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--hazard);color:#171A1E;padding:11px 22px;border-radius:4px;font-size:13px;font-weight:700;transition:transform .2s;z-index:70;font-family:var(--mono)}
.progbar.on{transform:translateX(-50%) translateY(0)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--slate);color:#fff;padding:11px 20px;border-radius:4px;font-size:13px;font-weight:600;transition:transform .2s;z-index:60}
.toast.on{transform:translateX(-50%) translateY(0)}
input[type=file]{display:none}
.foot-note{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:26px}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <div class="brand">
      <h1>VI Offline Assets</h1>
      <span class="sub" id="subtitle">168-hr triage board</span>
    </div>
    <div class="hd-actions">
      <span class="modesw" id="modesw">
        <button data-m="w168" class="on" onclick="setMode('w168')">168&#8209;hour</button>
        <button data-m="w48" onclick="setMode('w48')">48&#8209;hour</button>
      </span>
      <span class="weekof" id="weekof"></span>
      <button class="btn" id="btnExport">Export history</button>
      <button class="btn" id="btnImport">Import</button>
      <button class="btn primary" id="btnUpload">Upload weekly report</button>
      <span id="userBadge" style="font-family:var(--mono);font-size:11px;color:#9FB0BE"></span>
      <button class="btn" id="btnLogout" style="display:none" onclick="doLogout()">Sign out</button>
      <input type="file" id="fileIn" accept=".xlsx,.xls,.csv" multiple>
      <input type="file" id="jsonIn" accept=".json">
    </div>
  </div>
  <div class="triage" id="triage" style="display:none">
    <div class="wrap triage-in" id="triageIn"></div>
  </div>
</header>

<div class="warnbar" id="warnbar"></div>

<div class="wrap">
  <div class="nav" id="nav" style="display:none"></div>
</div>

<main class="wrap" id="main"></main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
/* ================= state ================= */
let S = {currentWeek:null, weeks:{}, assets:{}};
async function api(path, body){
  const r = await fetch('/api/'+path, body? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {});
  if(r.status===401){ showGate(); throw new Error('unauthorized'); }
  if(!r.ok) throw new Error('Server error ('+r.status+')');
  return r.json();
}
async function refresh(){ S = await api('state'); }
function save(){} /* server-persisted */

let view='overview', branchFilter=null, sortKey='daysOffline', sortDir=-1, search='';

/* ================= parsing ================= */
function num(v){ return parseFloat(String(v==null?'':v).replace(/,/g,''))||0; }
function parseReport(data){
  // cellDates+raw gives real Date objects and real numbers; the formatted strings SheetJS
  // returns otherwise use 2-digit years ("1/1/00"), which JS parses as 2000, not 1900.
  const wb = XLSX.read(data, {type:'array', cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
  const findHdr = (label) => rows.findIndex(r => (r||[]).some(v=>(v||'').toString().trim().toLowerCase()===label));
  // 48hr export: header on row 1, snake_case columns, no title row
  if(findHdr('asset_no') >= 0) return parse48(rows, findHdr('asset_no'));
  // 168hr weekly export: title row with "as of DATE", header row starting "Asset #"
  return parse168(rows);
}

function parse168(rows){
  let reportDate=null;
  for(const r of rows.slice(0,6)){
    const m=((r&&r[0])||'').toString().match(/as of (\d{4}-\d{2}-\d{2})/i);
    if(m){reportDate=m[1];break;}
  }
  const hi = rows.findIndex(r => ((r&&r[0])||'').toString().trim()==='Asset #');
  if(hi<0) throw new Error('Unrecognised file — expected the 168-hour weekly export (an "Asset #" header) or the 48-hour export (an "Asset_No" header).');
  const H = rows[hi].map(h=>(h||'').toString().trim().toLowerCase());
  const col = n => H.findIndex(h=>h.startsWith(n));
  const c={a:col('asset #'),cu:col('customer'),m:col('monitored'),b:col('branch'),t:col('asset type'),
           hb:col('last heartbeat'),h:col('hours'),d:col('days'),r:col('reliably'),l:col('suitable')};
  const assets=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[]; const a=((r[c.a])||'').toString().trim();
    if(!a) break;
    if(!/^CAM/i.test(a)) break;
    assets.push({
      id:a, customer:((r[c.cu])||'').toString().trim(),
      monitored:((r[c.m])||'').toString().trim()==='Yes',
      branch:((r[c.b])||'').toString().trim(),
      type:((r[c.t])||'').toString().trim(),
      lastHeartbeat:((r[c.hb])||'').toString().trim(),
      hoursOffline:num(r[c.h]), daysOffline:num(r[c.d]),
      reachable:((r[c.r])||'').toString().trim(),
      location:((r[c.l])||'').toString().trim(),
      pickles:/pickles/i.test(((r[c.cu])||'').toString())
    });
  }
  if(!assets.length) throw new Error('No camera rows found in the file.');
  if(!reportDate) reportDate = new Date().toISOString().slice(0,10);
  return {kind:'w168', reportDate, assets};
}

// Branch names differ between exports ("Melbourne Cameras" vs "Melbourne") — normalise so
// the same branch doesn't split in two across streams.
function normBranch(b){
  // "Melbourne Cameras" -> "Melbourne", "South-West Qld Cameras - Toowoomba" -> "South-West Qld - Toowoomba",
  // "Wellington Vision" -> "Wellington". Singular "Camera" is kept: "Canterbury Camera" is the real branch name.
  return (b||'').toString()
    .replace(/\s+Cameras\b/ig,'')
    .replace(/\s+Vision$/i,'')
    .replace(/\s{2,}/g,' ')
    .trim();
}
function toDateStr(v){
  if(v==null) return '';
  if(v instanceof Date) return isNaN(v) ? '' : v.toISOString().slice(0,19).replace('T',' ');
  const s=v.toString().trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,19).replace('T',' ');
  const d=new Date(s);
  return isNaN(d) ? s : d.toISOString().slice(0,19).replace('T',' ');
}
// Excel stores the hub's null placeholder as 1900-01-01, which lands on 1899-12-31 once the
// epoch offset is applied. Anything at or before 1900 is a placeholder, not a real reading.
function isSentinelDate(v){
  if(v==null || v==='') return true;
  if(v instanceof Date) return isNaN(v) || v.getUTCFullYear() <= 1900;
  const s=v.toString().trim();
  if(!s) return true;
  const m=s.match(/^(\d{4})-/);
  return m ? +m[1] <= 1900 : false;
}

function parse48(rows, hi){
  const H = rows[hi].map(h=>(h||'').toString().trim().toLowerCase());
  const col = n => H.indexOf(n);
  const c={a:col('asset_no'),cu:col('customer_name'),b:col('branch_description'),
           ad:col('address'),su:col('suburb'),pc:col('postcode'),st:col('state'),
           hb:col('last_heartbeat_time'),t:col('asset_type_name'),
           r:col('is_reliably_reachable'),l:col('is_suitable_location'),
           h:col('hours_offline'),d:col('days_offline'),sd:col('latest_snapshot_date')};
  const assets=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[]; const a=((r[c.a])||'').toString().trim();
    if(!a) continue;
    if(!/^CAM/i.test(a)) continue;
    const sentinel = isSentinelDate(r[c.hb]);
    const hb = sentinel ? '' : toDateStr(r[c.hb]);
    assets.push({
      id:a, customer:((r[c.cu])||'').toString().trim(),
      branch:normBranch(r[c.b]),
      address:((r[c.ad])||'').toString().trim(),
      suburb:((r[c.su])||'').toString().trim(),
      postcode:((r[c.pc])||'').toString().trim(),
      state:((r[c.st])||'').toString().trim(),
      type:((r[c.t])||'').toString().trim(),
      lastHeartbeat:hb,
      hoursOffline:num(r[c.h]), daysOffline:num(r[c.d]),
      reachable:((r[c.r])||'').toString().trim(),
      suitable:((r[c.l])||'').toString().trim(),
      snapshotDate:toDateStr(r[c.sd]).slice(0,10),
      sentinel,
      pickles:/pickles/i.test(((r[c.cu])||'').toString())
    });
  }
  if(!assets.length) throw new Error('No camera rows found in the 48-hour file.');
  const reportDate = assets.map(a=>a.snapshotDate).filter(Boolean).sort().pop()
                     || new Date().toISOString().slice(0,10);
  return {kind:'w48', reportDate, assets};
}

async function ingest(reportDate, assets, fileBase64, fileName){
  const payload = {reportDate, assets};
  if(fileBase64) { payload.fileBase64 = fileBase64; payload.fileName = fileName; }

}
async function ingest48(reportDate, assets, fileName){
  const res = await api('ingest48', {reportDate, assets, fileName});
  await refresh();
  return res;
}

  'not_reachable':'Not reliably reachable (hub flag)',
  'other':'Other known issue'
};

function sev(d){ return d>=90?4 : d>=30?3 : d>=14?2 : 1; }
function sevClass(d){ return 'd'+sev(d); }

/* ================= analytics ================= */
function weeksOrdered(){ return Object.keys(S.weeks).sort(); }
function memberSet(w){ return new Set((S.weeks[w]&&S.weeks[w].ids)||[]); }
function movement(){
  const ws = weeksOrdered(); if(ws.length<1) return null;
  const W = ws[ws.length-1], P = ws.length>1? ws[ws.length-2] : null;
  const cur = memberSet(W), prev = P? memberSet(P) : new Set();
  const firstSeen = {}; ws.forEach(w=>memberSet(w).forEach(id=>{ if(!(id in firstSeen)) firstSeen[id]=w; }));
  const newIn=[], returned=[], carried=[], cleared=[];
  cur.forEach(id=>{
    if(prev.has(id)) carried.push(id);
    else if(firstSeen[id]===W) newIn.push(id);
    else returned.push(id);
  });
  prev.forEach(id=>{ if(!cur.has(id)) cleared.push(id); });
  return {W, P, newIn, returned, carried, cleared};
}
function streak(rec){
  const ws = weeksOrdered(); let n=0;
  const ap = new Set(rec.appearances);
  for(let i=ws.length-1;i>=0;i--){ if(ap.has(ws[i])) n++; else break; }
  return n;
}
function churn(rec){
  const ws = weeksOrdered(); const ap=new Set(rec.appearances);
  let out=0, inside=false;
  for(const w of ws){ const here=ap.has(w); if(inside && !here) out++; inside=here; }
  return out; // times it dropped off then (possibly) came back
}
function weeklySeries(){
  const ws = weeksOrdered();
  return ws.map((w,i)=>{
    const ids = (S.weeks[w].ids)||[];
    const prev = i>0? memberSet(ws[i-1]) : null;
    const cur = new Set(ids);
    let inn=0, out=0;
    if(prev){ cur.forEach(id=>{ if(!prev.has(id)) inn++; }); prev.forEach(id=>{ if(!cur.has(id)) out++; }); }
    const pk = ids.filter(id=>S.assets[id]&&S.assets[id].snap.pickles).length;
    return {week:w, total:ids.length, pickles:pk, inn, out};
  });
}

  // chronic: top by appearances among current-week assets, plus recently cleared chronics
  const chron = Object.entries(S.assets)
    .map(([id,r])=>({id, r, n:r.appearances.length, st:streak(r), ch:churn(r)}))
    .filter(x=>x.n>1).sort((a,b)=>b.n-a.n || b.st-a.st).slice(0,20);
  // branch matrix over last 8 weeks
  const last = ws.slice(-8);
  const brs = {};
  last.forEach(w=>{ (S.weeks[w].ids||[]).forEach(id=>{ const b=(S.assets[id]||{snap:{}}).snap.branch||'?'; (brs[b]=brs[b]||{})[w]=(brs[b][w]||0)+1; }); });
  const brRows = Object.entries(brs).map(([b,m2])=>({b, vals:last.map(w=>m2[w]||0)}))

  $('#main').innerHTML = `
  <div class="mcards">
    <div class="mcard in ${trendSel==='newIn'?'on':''}" onclick="trendSel='newIn';render()"><div class="n">${m.newIn.length}</div><div class="l">New this week</div><div class="s">first time on any report</div></div>
    <div class="mcard ret ${trendSel==='returned'?'on':''}" onclick="trendSel='returned';render()"><div class="n">${m.returned.length}</div><div class="l">Boomerangs</div><div class="s">cleared before, back again — battery suspects</div></div>
    <div class="mcard car ${trendSel==='carried'?'on':''}" onclick="trendSel='carried';render()"><div class="n">${m.carried.length}</div><div class="l">Carried over</div><div class="s">still down from last report</div></div>
    <div class="mcard clr ${trendSel==='cleared'?'on':''}" onclick="trendSel='cleared';render()"><div class="n">${m.cleared.length}</div><div class="l">Cleared</div><div class="s">off the report since last week</div></div>
  </div>
  <div class="card">
    <h2>Weekly totals — ${ws.length} reports (${ws[0]} → ${m.W})</h2>
    <div style="padding:14px 16px">${trendChart(series)}</div>
  </div>
  <div class="tgrid">
    <div class="card">
      <h2>${({newIn:'New this week',returned:'Boomerangs — cleared then back',carried:'Carried over',cleared:'Cleared since last report'})[trendSel]} (${sel.length})</h2>
      <table><thead><tr><th>Asset</th><th>Customer</th><th>Branch</th><th>Wks seen</th><th>${trendSel==='cleared'?'Was offline':'Offline'}</th></tr></thead><tbody>
      ${sel.map(id=>{const r=S.assets[id]; if(!r) return ''; const a=r.snap;
        return `<tr class="asset" onclick="openDrawer('${a.id}')">
          <td><span class="aid">${esc(a.id)}</span>${a.pickles?'<span class="pk-flag">PICKLES</span>':''}</td>
          <td><span class="cust">${esc(a.customer)}</span></td><td>${esc(a.branch)}</td>
          <td style="font-family:var(--mono)">${r.appearances.length}</td>
          <td><span class="dtag ${sevClass(a.daysOffline)}">${fmtDays(a.daysOffline)}</span></td></tr>`;}).join('')}
      ${!sel.length?'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:24px">None.</td></tr>':''}
      </tbody></table>
    </div>
    <div>
      <div class="card" style="margin-bottom:18px">
        <h2>Chronic cameras — most weeks on report</h2>
        <table><thead><tr><th>Asset</th><th>Branch</th><th>Wks</th><th>Streak</th><th>Drop-offs</th><th>Timeline</th></tr></thead><tbody>
        ${chron.map(x=>{const a=x.r.snap; const ap=new Set(x.r.appearances);
          const dots = ws.slice(-16).map(w=>`<span class="wdot ${ap.has(w)?'on':''}" title="${w}"></span>`).join('');
          return `<tr class="asset" onclick="openDrawer('${x.id}')">
            <td><span class="aid">${esc(x.id)}</span>${a.pickles?'<span class="pk-flag">PICKLES</span>':''}</td>
            <td>${esc(a.branch)}</td>
            <td style="font-family:var(--mono);font-weight:600">${x.n}</td>
            <td style="font-family:var(--mono)">${x.st}</td>
            <td style="font-family:var(--mono)">${x.ch||''}</td>
            <td><span class="dotrow">${dots}</span></td></tr>`;}).join('')}
        </tbody></table>
      </div>
      <div class="card">
        <h2>Branches — last ${last.length} reports</h2>
        <table><thead><tr><th>Branch</th>${last.map(w=>`<th style="text-align:center">${w.slice(5)}</th>`).join('')}<th></th></tr></thead><tbody>
        ${brRows.map(r=>{
          const a=r.vals[r.vals.length-1], b=r.vals.length>1? r.vals[r.vals.length-2] : a;
          const ar = a>b? '<span class="trend-arrow" style="color:var(--red)">&#9650;</span>' : a<b? '<span class="trend-arrow" style="color:var(--green)">&#9660;</span>' : '<span style="color:var(--muted)">&ndash;</span>';
          return `<tr class="asset" onclick="goBranch('${esc(r.b).replace(/'/g,"\\'")}')"><td style="font-weight:600">${esc(r.b)}</td>${r.vals.map(v=>`<td style="text-align:center;font-family:var(--mono)">${v||'<span style=\'color:#C9CEC6\'>0</span>'}</td>`).join('')}<td>${ar}</td></tr>`;}).join('')}
        </tbody></table>
      </div>
    </div>
  </div>`;
}
function trendChart(series){
  const W=920,H=190,pad=34,pb=44;
  const n=series.length, mx=Math.max(...series.map(s=>s.total),1);
  const x=i=> pad + i*( (W-pad-10) / Math.max(n-1,1) );
  const y=v=> (H-pb) - v/mx*(H-pb-14);
  const line=k=> series.map((s,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(s[k]).toFixed(1)}`).join(' ');
  const mxio=Math.max(...series.map(s=>Math.max(s.inn,s.out)),1);
  const bw=Math.min(14,(W-pad-10)/Math.max(n,1)/3);
  const bars=series.map((s,i)=>{ if(!i) return '';
    const bx=x(i);
    return `<rect x="${bx-bw-1}" y="${H-pb+6}" width="${bw}" height="${(s.inn/mxio*(pb-18)).toFixed(1)}" fill="#C0392B" opacity=".75"><title>${s.week}: +${s.inn} in</title></rect>
            <rect x="${bx+1}" y="${H-pb+6}" width="${bw}" height="${(s.out/mxio*(pb-18)).toFixed(1)}" fill="#2F7A4D" opacity=".75"><title>${s.week}: &minus;${s.out} out</title></rect>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;font-family:var(--mono)">
    ${[0,.5,1].map(f=>`<line x1="${pad}" x2="${W-10}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="#E5E8E2"/><text x="${pad-6}" y="${y(mx*f)+3}" font-size="10" fill="#8A94A0" text-anchor="end">${Math.round(mx*f)}</text>`).join('')}
    ${bars}
    <path d="${line('total')}" fill="none" stroke="#232B33" stroke-width="2.2"/>
    <path d="${line('pickles')}" fill="none" stroke="#D9A404" stroke-width="2"/>
    ${series.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.total)}" r="3" fill="#232B33"><title>${s.week}: ${s.total} offline</title></circle>`).join('')}
    ${series.map((s,i)=> n<=14 || i%2==0 || i==n-1 ? `<text x="${x(i)}" y="${H-2}" font-size="9.5" fill="#8A94A0" text-anchor="middle">${s.week.slice(5)}</text>`:'').join('')}
    <text x="${W-10}" y="12" font-size="10" fill="#232B33" text-anchor="end">&#9632; total &nbsp;</text>
    <text x="${W-10}" y="24" font-size="10" fill="#D9A404" text-anchor="end">&#9632; pickles</text>
    <text x="${pad}" y="${H-pb+2}" font-size="9" fill="#8A94A0">in/out</text>
  </svg>`;
}

function renderKnown(parkedList){
  const byReason = {};
  parkedList.forEach(r=>{
    const p = parkedMap()[r.snap.id];
    const k = p.reason||'other';
    (byReason[k]=byReason[k]||[]).push(r);
  });
  const groups = Object.entries(PARK_REASONS).filter(([k])=>byReason[k]&&byReason[k].length);
  $('#main').innerHTML = `<div class="card">
    <div class="tbl-hd"><h2>Known issues — parked cameras</h2>
      <span class="tally">${parkedList.length} camera${parkedList.length!==1?'s':''} parked &middot; excluded from triage counts${(()=>{const a=Object.values(parkedMap()).filter(p=>p.auto).length; return a?` &middot; ${a} auto from hub flags`:'';})()}</span></div>
    ${groups.map(([k,label])=>{
      const items = byReason[k];
      return `<div class="park-group">
        <div class="park-reason">${esc(label)} <span class="ct">${items.length}</span></div>
        <table><tbody>
        ${items.map(r=>{const a=r.snap, p=parkedMap()[a.id], n=appearCount(r);
          return `<tr class="asset" onclick="openDrawer('${a.id}')">
            <td><span class="aid">${esc(a.id)}</span>${a.pickles?'<span class="pk-flag">PICKLES</span>':''}${n>1?`<span class="rep-flag">&times;${n}</span>`:''}</td>
            <td><span class="cust">${esc(a.customer)}</span></td>
            <td>${esc(a.branch)}</td>
            <td><span class="dtag ${sevClass(a.daysOffline)}">${fmtDays(a.daysOffline)}</span></td>
            <td style="font-size:12px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.note)}">${p.auto?'<span class="tag-flag">AUTO</span> ':''}${esc(p.note||'')}</td>
            <td style="text-align:right"><button class="unpark-btn" onclick="event.stopPropagation();doUnpark('${a.id}')">Return to triage</button></td>
          </tr>`;}).join('')}
        </tbody></table></div>`;}).join('')}
    ${!parkedList.length?`<div style="padding:30px;text-align:center;color:var(--muted)">No cameras parked on the ${mode==='w48'?'48-hour':'168-hour'} board. Parking is tracked separately for each board.</div>`:''}
  </div>`;
}
function doUnpark(id){
  api('unpark',{id}).then(()=>refresh().then(()=>{ render(); toast(id+' returned to triage'); })).catch(()=>toast('Failed — retry'));
}
function doPark(id){
  const reason = document.getElementById('park-reason').value;
  const note = (document.getElementById('park-note').value||'').trim();
  if(!reason){ toast('Pick a reason'); return; }
  api('park',{id, reason, note}).then(()=>
    refresh().then(()=>{ render(); openDrawer(id); toast(id+' parked as known issue'); })
  ).catch(()=>toast('Failed — retry'));
}

let actUser='', actAction='';

    const log = await (await fetch('/api/activity?limit=500')).json();
    const users = [...new Set(log.map(r=>r.email).filter(Boolean))].sort();

                   unparked:'Unparked', upload:'Upload', signin:'Signed in'};
    $('#main').innerHTML = `<div class="card">
      <div class="tbl-hd">

          <span class="tally">${rows.length} of ${log.length} event${log.length!==1?'s':''}</span>
        </div>
        <div class="act-filters">
          <select onchange="actUser=this.value;render()">
            <option value="">All users</option>
            ${users.map(u=>`<option value="${esc(u)}" ${u===actUser?'selected':''}>${esc(u)}</option>`).join('')}
          </select>
          <select onchange="actAction=this.value;render()">
            <option value="">All actions</option>

          <span class="act-ts">${esc(r.ts.slice(0,16).replace('T',' '))}</span>

let w48Filter='all', w48Search='';

function render48(W){
  $('#weekof').innerHTML = `Report: <b>${W.currentWeek}</b>`;
  const ids=(W.weeks[W.currentWeek]||{}).ids||[];
  const all=ids.map(id=>W.assets[id]).filter(Boolean);
  const active=all.filter(r=>!isParked(r.snap.id));
  const parkedList=allParked();
  const early=active.filter(r=>!r.snap.sentinel && r.snap.daysOffline<7);
  const dq=active.filter(r=>r.snap.sentinel);
  const realMax=Math.max(0,...active.filter(r=>!r.snap.sentinel).map(r=>r.snap.daysOffline));
  const pk=active.filter(r=>r.snap.pickles);
  const wks=Object.keys(W.weeks).sort();
  const prev=wks.length>1?wks[wks.length-2]:null;
  const prevIds=prev?new Set((W.weeks[prev]||{}).ids||[]):null;
  const newIn=prevIds?active.filter(r=>!prevIds.has(r.snap.id)).length:null;
  const out=prevIds?[...prevIds].filter(id=>!ids.includes(id)).length:null;

  $('#nav').innerHTML = navHtml([
    ['w48','Overview',null], ['w48all','All over 48h',active.length],
    ['w48early','Early warning',early.length], ['w48dq','No heartbeat',dq.length],
    ['trends','Trends',null], ['known','Known issues',parkedList.length],
    ['reports','Reports',null], ['activity','Activity log',null]]);

  const pkBr={}; pk.forEach(r=>pkBr[r.snap.branch]=(pkBr[r.snap.branch]||0)+1);
  const chips=Object.entries(pkBr).sort((a,b)=>b[1]-a[1])
    .map(([b,n])=>`<span class="chip">${esc(b)} <b>${n}</b></span>`).join('');
  $('#triageIn').innerHTML = `
    <div class="t-block" onclick="go('w48early')">
      <div class="t-label"><span class="tag">EARLY</span> Under 7 days</div>
      <div class="t-num ${early.length?'':'ok'}">${early.length}</div>
      <div class="t-sub">catch before they hit the 168h board</div>
    </div>
    <div class="t-block" onclick="go('w48all')">
      <div class="t-label">Total offline &gt;48h</div>
      <div class="t-num">${active.length}</div>
      <div class="t-sub">${all.length} reported${parkedList.length?` &middot; ${parkedList.length} parked`:''}${
        newIn!==null?` &middot; <span style="color:${newIn>out?'#E58676':'#6FBF8E'}">${newIn>out?'+':''}${newIn-out} vs last wk</span> <span style="color:#7E909E">(+${newIn} in / &minus;${out} out)</span>`:''}</div>
    </div>
    <div class="t-block" onclick="go('w48all','__longest')">
      <div class="t-label">Longest offline</div>
      <div class="t-num">${realMax}<span style="font-size:18px">d</span></div>
      <div class="t-sub">excludes cameras with no heartbeat</div>
    </div>
    <div class="t-block" onclick="go('w48')">
      <div class="t-label"><span class="tag">PRIORITY</span> Pickles down</div>
      <div class="t-num ${pk.length?'':'ok'}">${pk.length}</div>
      <div class="t-chips">${chips || '<span class="chip">all clear</span>'}</div>
    </div>
    ${dq.length?`<div class="t-block" onclick="go('w48dq')">
      <div class="t-label">No heartbeat</div>
      <div class="t-num" style="color:#C77F0A">${dq.length}</div>
      <div class="t-sub">durations unreliable</div>
    </div>`:''}`;

  if(view==='w48') return renderW48Overview(active, all, early, dq, W);
  if(view==='w48all') return renderW48List(branchFilter? active.filter(r=>r.snap.branch===branchFilter):active, branchFilter||'All cameras over 48 hours', W);
  if(view==='w48early') return renderW48List(early, 'Early warning — under 7 days offline', W);
  if(view==='w48dq') return renderW48List(dq, 'No heartbeat recorded — durations unreliable', W);
  if(view==='trends') return renderTrends48(W);
  if(view==='known') return renderKnown(parkedList);
  if(view==='reports') return renderReports();
  if(view==='activity') return renderActivity();
  view='w48'; return renderW48Overview(active, all, early, dq, W);
}

function renderW48Overview(active, all, early, dq, W){
  const byBr={};
  active.forEach(r=>{ const b=r.snap.branch||'?'; (byBr[b]=byBr[b]||{n:0,pk:0,early:0}); byBr[b].n++;
    if(r.snap.pickles) byBr[b].pk++;
    if(!r.snap.sentinel && r.snap.daysOffline<7) byBr[b].early++; });
  const rows=Object.entries(byBr).sort((a,b)=>b[1].n-a[1].n);
  const maxN=Math.max(1,...rows.map(r=>r[1].n));
  const worst=active.filter(r=>!r.snap.sentinel).sort((a,b)=>b.snap.daysOffline-a.snap.daysOffline).slice(0,10);
  const wks=Object.keys(W.weeks).sort();
  $('#main').innerHTML=`<div class="grid">
    <div class="card">
      <h2>Over 48 hours by branch</h2>
      ${rows.map(([b,v])=>`
        <div class="branch-row" onclick="goBranch48('${esc(b).replace(/'/g,"\\'")}')">
          <span class="nm">${esc(b)}${v.pk?'<span class="pk-dot" title="Pickles cameras here"></span>':''}${v.early?`<span class="tag-early" title="${v.early} under 7 days">${v.early} new</span>`:''}</span>
          <span class="meta"><span class="bar" style="width:${Math.round(v.n/maxN*90)}px"></span><span class="n">${v.n}</span></span>
        </div>`).join('')}
    </div>
    <div class="card">
      <h2>Longest offline — excludes cameras with no heartbeat</h2>
      <table><thead><tr><th>Asset</th><th>Customer</th><th>Branch</th><th>Offline</th></tr></thead>
      <tbody>${worst.map(r=>{const a=r.snap;
        return `<tr class="asset" onclick="openDrawer48('${esc(a.id)}')">
          <td><span class="aid">${esc(a.id)}</span>${a.pickles?'<span class="pk-flag">PICKLES</span>':''}</td>
          <td><span class="cust" title="${esc(a.customer)}">${esc(a.customer)}</span></td>
          <td>${esc(a.branch)}</td>
          <td><span class="dtag ${sevClass(a.daysOffline)}">${fmtDays(a.daysOffline)}</span></td></tr>`;}).join('')}
      </tbody></table>
    </div>
  </div>
  <div class="foot-note">${wks.length} × 48hr report${wks.length>1?'s':''} loaded (${wks[0]} → ${W.currentWeek}) &middot; ${all.length} cameras reported, ${early.length} under 7 days, ${dq.length} with no heartbeat &middot; this board is independent of the 168-hour one</div>`;
}

function goBranch48(b){ view='w48all'; branchFilter=b; w48Search=''; render(); window.scrollTo(0,0); }

function renderTrends48(W){
  const wks=Object.keys(W.weeks).sort();
  if(wks.length<2){
    $('#main').innerHTML='<div class="card" style="padding:34px;text-align:center;color:var(--muted)">Trends need at least two 48-hour reports. Upload more and this fills in: week-over-week movement, chronic cameras, branch trajectories.</div>';
    return;
  }
  const series=wks.map((w,i)=>{
    const ids=(W.weeks[w].ids)||[];
    const prev=i>0?new Set((W.weeks[wks[i-1]].ids)||[]):null;
    const cur=new Set(ids); let inn=0,out=0;
    if(prev){ cur.forEach(id=>{if(!prev.has(id))inn++;}); prev.forEach(id=>{if(!cur.has(id))out++;}); }
    const pk=ids.filter(id=>W.assets[id]&&W.assets[id].snap.pickles).length;
    return {week:w,total:ids.length,pickles:pk,inn,out};
  });
  const chron=Object.entries(W.assets).map(([id,r])=>({id,r,n:r.appearances.length}))
    .filter(x=>x.n>1).sort((a,b)=>b.n-a.n).slice(0,20);
  const last=wks.slice(-8), brs={};
  last.forEach(w=>{ ((W.weeks[w].ids)||[]).forEach(id=>{
    const b=(W.assets[id]||{snap:{}}).snap.branch||'?'; (brs[b]=brs[b]||{})[w]=(brs[b][w]||0)+1; }); });
  const brRows=Object.entries(brs).map(([b,m])=>({b,vals:last.map(w=>m[w]||0)}))
    .sort((a,b)=>b.vals[b.vals.length-1]-a.vals[a.vals.length-1]);
  $('#main').innerHTML=`
  <div class="card"><h2>Weekly totals — ${wks.length} × 48hr reports (${wks[0]} → ${wks[wks.length-1]})</h2>
    <div style="padding:14px 16px">${trendChart(series)}</div></div>
  <div class="tgrid">
    <div class="card"><h2>Chronic cameras — most weeks on the 48hr report</h2>
      <table><thead><tr><th>Asset</th><th>Branch</th><th>Wks</th><th>Timeline</th></tr></thead><tbody>
      ${chron.map(x=>{const a=x.r.snap, ap=new Set(x.r.appearances);
        return `<tr class="asset" onclick="openDrawer48('${esc(x.id)}')">
          <td><span class="aid">${esc(x.id)}</span>${a.pickles?'<span class="pk-flag">PICKLES</span>':''}</td>
          <td>${esc(a.branch)}</td><td style="font-family:var(--mono);font-weight:600">${x.n}</td>
          <td><span class="dotrow">${wks.slice(-16).map(w=>`<span class="wdot ${ap.has(w)?'on':''}" title="${w}"></span>`).join('')}</span></td></tr>`;}).join('')}
      </tbody></table></div>
    <div class="card"><h2>Branches — last ${last.length} reports</h2>
      <table><thead><tr><th>Branch</th>${last.map(w=>`<th style="text-align:center">${w.slice(5)}</th>`).join('')}<th></th></tr></thead><tbody>
      ${brRows.map(r=>{const a=r.vals[r.vals.length-1], b=r.vals.length>1?r.vals[r.vals.length-2]:a;
        const ar=a>b?'<span class="trend-arrow" style="color:var(--red)">&#9650;</span>':a<b?'<span class="trend-arrow" style="color:var(--green)">&#9660;</span>':'<span style="color:var(--muted)">&ndash;</span>';
        return `<tr class="asset" onclick="goBranch48('${esc(r.b).replace(/'/g,"\\'")}')"><td style="font-weight:600">${esc(r.b)}</td>${r.vals.map(v=>`<td style="text-align:center;font-family:var(--mono)">${v||0}</td>`).join('')}<td>${ar}</td></tr>`;}).join('')}
      </tbody></table></div>
  </div>`;
}

function openDrawer48(id){
  const r=(S.w48&&S.w48.assets||{})[id]; if(!r) return;
  const a=r.snap, wks=Object.keys((S.w48||{}).weeks||{}).sort();
  const p=parkedMap()[id];
  $('#drawer').innerHTML=`
    <div class="dw-hd" style="position:relative">
      <button class="x" onclick="closeDrawer()">&times;</button>
      <div class="aid">${esc(a.id)} ${a.pickles?'<span class="pk-flag" style="vertical-align:3px">PICKLES</span>':''}</div>
      <div class="c">${esc(a.customer)}</div>
    </div>
    <div class="dw-body">
      ${a.sentinel?'<div class="hist-item appear" style="margin-bottom:14px"><b>No heartbeat recorded.</b> The hub has a 1900-01-01 placeholder for this camera, so the offline duration shown in the report is not meaningful.</div>':''}
      <div class="kv">
        <span class="k">Branch</span><span class="v">${esc(a.branch)}</span>
        <span class="k">Site</span><span class="v">${esc([a.address,a.suburb,a.state,a.postcode].filter(Boolean).join(', ')||'—')}</span>
        <span class="k">Asset type</span><span class="v">${esc(a.type)}</span>
        <span class="k">Offline</span><span class="v">${a.sentinel?'unreliable':a.daysOffline+'d ('+a.hoursOffline+'h)'}</span>
        <span class="k">Last heartbeat</span><span class="v">${a.sentinel?'none recorded':esc(a.lastHeartbeat)}</span>
        <span class="k">Reliably reachable</span><span class="v">${esc(a.reachable||'—')}</span>
        <span class="k">Suitable location</span><span class="v">${esc(a.suitable||'—')}</span>
        <span class="k">Snapshot date</span><span class="v">${esc(a.snapshotDate||'—')}</span>
        <span class="k">On 48hr reports</span><span class="v">${r.appearances.length} week${r.appearances.length>1?'s':''}</span>
      </div>
      ${p?`<div class="dw-sec">Parked</div><div class="hist-item">${esc(PARK_REASONS[p.reason]||p.reason)}${p.auto?' (automatic)':''}<br><span style="color:var(--muted)">${esc(p.note||'')}</span></div>
        <button class="unpark-btn" style="margin-top:8px" onclick="doUnpark('${esc(a.id)}');closeDrawer()">Return to triage</button>`:''}
      <div class="dw-sec">Weekly presence (48hr reports)</div>
      <div class="dotrow">${wks.map(w=>{const on=r.appearances.includes(w); const d=(r.days||{})[w];
        return `<span class="wdot ${on?'on':''}" title="${w}${on&&d!=null?': '+d+'d':''}"></span>`;}).join('')}</div>
    </div>`;
  $('#overlay').classList.add('on'); $('#drawer').classList.add('on');
}
function releaseAuto(){
  if(!confirm('Release all auto-parked cameras back into triage?')) return;
  api('unpark_auto').then(async r=>{ await refresh(); render(); toast(`Released ${r.released} cameras`); })
    .catch(()=>toast('Failed — retry'));
}

async function renderReports(){
  try{
    const reps = await (await fetch('/api/reports')).json();
    const cur = S.currentWeek;
    $('#main').innerHTML = `<div class="card">
      <h2>Uploaded reports &mdash; source files</h2>
      ${reps.length? reps.map(r=>`
        <div class="rpt-row">
          <span class="rpt-wk">${esc(r.week)}${r.week===cur?' <span class="rpt-cur">CURRENT</span>':''}</span>
          <span class="rpt-fn">${esc(r.filename)}</span>
          <span class="rpt-sz">${(r.size/1024).toFixed(0)} KB</span>
          <a class="rpt-dl" href="/api/reports/${encodeURIComponent(r.week)}/download">&#8681; Download</a>
        </div>`).join('') : '<div style="padding:30px;text-align:center;color:var(--muted)">No source files stored yet. Re-upload your reports after this update and the xlsx files will be archived here.</div>'}
    </div>
    <div class="foot-note">Source files are stored server-side and downloadable by anyone with access to this board. Re-upload historical reports to backfill.</div>`;
  }catch(e){ $('#main').innerHTML='<div class="card" style="padding:30px;color:var(--red)">Failed to load reports: '+esc(e.message)+'</div>'; }
}

/* ================= drawer ================= */
let drawerId=null;
function openDrawer(id){
  drawerId=id;
  const r=S.assets[id]; if(!r) return;
  const a=r.snap, fixed=isFixed(r);
  const events=[];
  r.appearances.forEach(w=>events.push({ts:w, cls:'appear', txt:`Appeared on weekly report ${w}`}));
  r.fixes.forEach(f=>events.push({ts:f.date, cls:'fix', txt:`Marked fixed (report ${f.week})`}));
  r.comments.forEach(c=>events.push({ts:c.ts, cls:'', txt:c.text, by:c.by||''}));
  events.sort((x,y)=>String(y.ts).localeCompare(String(x.ts)));
  $('#drawer').innerHTML = `
    <div class="dw-hd" style="position:relative">
      <button class="x" onclick="closeDrawer()">&times;</button>
      <div class="aid">${esc(a.id)} ${a.pickles?'<span class="pk-flag" style="vertical-align:3px">PICKLES</span>':''}</div>
      <div class="c">${esc(a.customer)}</div>
    </div>
    <div class="dw-body">
      <div class="kv">
        <span class="k">Branch</span><span class="v">${esc(a.branch)}</span>
        <span class="k">Asset type</span><span class="v">${esc(a.type)}</span>
        <span class="k">Offline</span><span class="v">${a.daysOffline}d (${a.hoursOffline}h)</span>
        <span class="k">Last heartbeat</span><span class="v">${esc(a.lastHeartbeat)}</span>
        <span class="k">Monitored</span><span class="v">${a.monitored?'Yes':'No'}</span>
        ${a.reachable?`<span class="k">Reliably reachable</span><span class="v">${esc(a.reachable)}</span>`:''}
        ${a.location?`<span class="k">Suitable location</span><span class="v">${esc(a.location)}</span>`:''}
        <span class="k">Report appearances</span><span class="v">${appearCount(r)} week${appearCount(r)>1?'s':''} &middot; streak ${streak(r)}${churn(r)?` &middot; dropped off &times;${churn(r)}`:''}</span>
      </div>
      <div class="dw-sec">Weekly presence</div>
      <div class="dotrow">${weeksOrdered().map(w=>{const on=r.appearances.includes(w); const d=(r.days||{})[w];
        return `<span class="wdot ${on?'on':''}" title="${w}${on&&d!=null?': '+d+'d offline':''}"></span>`;}).join('')}</div>
      <div class="dw-sec">Add note</div>
      <textarea class="cbox" id="cbox" placeholder="e.g. battery replaced, camera in full shade, client moved unit — notes persist and resurface if this camera comes back"></textarea>
      <div class="dw-sec">History</div>
      ${events.map(e=>`<div class="hist-item ${e.cls}"><span class="ts">${esc(String(e.ts).slice(0,16).replace('T',' '))}</span>${esc(e.txt)}${e.by?`<span class="by-tag">— ${esc(e.by)}</span>`:''}</div>`).join('') || '<div style="color:var(--muted);font-size:12.5px">No history yet.</div>'}
    </div>
    <div class="dw-foot" style="flex-direction:column;gap:10px">
      <div style="display:flex;gap:8px;width:100%">
        <button class="save" onclick="saveNote()">Save note</button>
        <button class="fixbtn ${fixed?'done':''}" onclick="toggleFix('${a.id}');openDrawer('${a.id}')" style="flex:1">${fixed?'&#10003; Fixed — undo':'Mark fixed'}</button>
      </div>
      ${isParked(a.id)?`
        <div style="display:flex;align-items:center;gap:8px;width:100%">
          <span style="font-size:11px;color:var(--amber);font-weight:700;flex:1">&#9888; Parked: ${esc(PARK_REASONS[parkedMap()[a.id].reason]||parkedMap()[a.id].reason)}</span>
          <button class="unpark-btn" onclick="doUnpark('${a.id}');openDrawer('${a.id}')">Return to triage</button>
        </div>
      `:`
        <details style="width:100%">
          <summary style="font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;padding:4px 0">Park as known issue &rarr;</summary>
          <div style="margin-top:6px">
            <select id="park-reason" class="park-select">
              <option value="">Select reason…</option>
              ${Object.entries(PARK_REASONS).map(([k,v])=>'<option value="'+k+'">'+esc(v)+'</option>').join('')}
            </select>
            <textarea id="park-note" class="park-note-input" placeholder="Optional note — e.g. client contacted 3 Jul, aware camera is in shade"></textarea>
            <button class="park-submit" onclick="doPark('${a.id}')">Park this camera</button>
          </div>
        </details>
      `}
    </div>`;
  $('#overlay').classList.add('on'); $('#drawer').classList.add('on');
}
function closeDrawer(){ drawerId=null; $('#overlay').classList.remove('on'); $('#drawer').classList.remove('on'); }
function saveNote(){
  const t=$('#cbox').value.trim(); if(!t||!drawerId) return;
  const id=drawerId;
  api('note',{id, text:t}).then(res=>{
    S.assets[id].comments.push({ts:res.ts, text:res.text||t, by:res.by||currentUser});
    if(drawerId===id) openDrawer(id);
    render(); toast('Note saved');
  }).catch(()=>toast('Save failed — retry'));
}

/* ================= actions ================= */
function toggleFix(id){
  const r=S.assets[id]; if(!r) return;
  const i=r.fixes.findIndex(f=>f.week===S.currentWeek);
  const on = i<0;
  if(on){ r.fixes.push({week:S.currentWeek, date:new Date().toISOString()}); toast(id+' marked fixed'); }
  else { r.fixes.splice(i,1); toast(id+' reopened'); }
  render();
  if(drawerId===id) openDrawer(id);
  api('fix',{id, week:S.currentWeek, on}).then(()=>refresh().then(()=>{render(); if(drawerId===id) openDrawer(id);})).catch(()=>{ toast('Save failed — refresh and retry'); });
}
function go(v, opt){ view=v; branchFilter=null; search=''; w48Search='';
  if(opt==='__longest'){sortKey='daysOffline';sortDir=-1;}
  render(); window.scrollTo(0,0); }
function goBranch(b){ view='all'; branchFilter=b; search=''; render(); window.scrollTo(0,0); }
function clearBranch(){ branchFilter=null; render(); }
function setSort(k){ if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir = (k==='daysOffline'||k==='hoursOffline')?-1:1;} render(); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2200); }

/* ================= io ================= */
function readFile(f){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=e=>res(new Uint8Array(e.target.result));
    rd.onerror=()=>rej(new Error('Could not read '+f.name));
    rd.readAsArrayBuffer(f);
  });
}
function toB64(bytes){
  let s=''; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(s);
}
async function handleFiles(fileList){
  const files=[...fileList]; if(!files.length) return;
  const parsed=[], failed=[];
  for(const f of files){
    try{
      const bytes=await readFile(f);
      const p=parseReport(bytes);
      parsed.push({name:f.name, kind:p.kind, reportDate:p.reportDate, assets:p.assets, b64:toB64(bytes)});
    }catch(err){ failed.push(`${f.name}: ${err.message}`); }
  }
  if(!parsed.length){ alert('No readable reports.\n\n'+failed.join('\n')); return; }
  parsed.sort((a,b)=>a.reportDate.localeCompare(b.reportDate));
  let done=0, cam168=0, autoParked=0, sent=0, early=0;
  const w168=[], w48=[];
  for(const p of parsed){
    showProgress(`Uploading ${++done} of ${parsed.length} — ${p.kind==='w48'?'48hr':'168hr'} report ${p.reportDate}`);
    try{
      if(p.kind==='w48'){
        const r=await ingest48(p.reportDate, p.assets, p.name);
        w48.push(p.reportDate); autoParked+=(r.autoParked||[]).length;
        sent+=r.sentinels||0; early+=r.early||0;
      } else {
        await ingest(p.reportDate, p.assets, p.b64, p.name);
        w168.push(p.reportDate); cam168+=p.assets.length;
      }
    }catch(err){ failed.push(`${p.name}: ${err.message}`); }
  }
  hideProgress();
  branchFilter=null;
  if(w48.length && !w168.length){ mode='w48'; view='w48'; }
  else if(w168.length){ mode='w168'; view='overview'; }
  render();
  const bits=[];
  if(w168.length) bits.push(`${w168.length} weekly 168hr report${w168.length>1?'s':''} · ${cam168} camera rows`);
  if(w48.length){
    bits.push(`${w48.length} × 48hr report${w48.length>1?'s':''} · ${early} under 7 days`);
    if(autoParked) bits.push(`${autoParked} auto-parked as known issues`);
    if(sent) bits.push(`${sent} with no heartbeat`);
  }
  toast(bits.join(' · '));
  if(failed.length) alert('Some files could not be loaded:\n\n'+failed.join('\n'));
}
function showProgress(t){
  let el=document.getElementById('prog');
  if(!el){ el=document.createElement('div'); el.id='prog'; el.className='progbar'; document.body.appendChild(el); }
  el.textContent=t; el.classList.add('on');
}
function hideProgress(){ const el=document.getElementById('prog'); if(el) el.classList.remove('on'); }
document.getElementById('btnUpload').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=e=>{ handleFiles(e.target.files); e.target.value=''; };
document.getElementById('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`vi-offline-history-${new Date().toISOString().slice(0,10)}.json`; a.click();
};
document.getElementById('btnImport').onclick=()=>document.getElementById('jsonIn').click();
document.getElementById('jsonIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ev=>{ try{ const d=JSON.parse(ev.target.result); if(!d.assets) throw 0; await api('import', d); await refresh(); render(); toast('History imported'); }catch(_){ alert('Import failed — not a valid history export.'); } };
  rd.readAsText(f); e.target.value='';
};
$('#overlay').onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

function wireDrop(){
  const dz=document.getElementById('dz'); if(!dz) return;
  ['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('hot');}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('hot');}));
  dz.addEventListener('drop',e=>{ handleFiles(e.dataTransfer.files); });
}
let currentUser = '';
function showGate(){
  $('#nav').style.display='none'; $('#triage').style.display='none';
  $('#weekof').innerHTML=''; $('#userBadge').textContent='';
  $('#btnLogout').style.display='none';
  $('#main').innerHTML = `<div class="drop" style="padding:60px 30px">
    <h3>Sign in to VI Offline Assets</h3>
    <p>Enter your Vision Intelligence email address and the shared access password to continue.</p>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;max-width:300px;margin:0 auto">
      <input id="em" type="email" style="border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-family:var(--sans);font-size:13px;width:100%" placeholder="Email address" autocomplete="email">
      <input id="pc" type="password" style="border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-family:var(--mono);font-size:14px;width:100%" placeholder="Password" autocomplete="current-password">
      <button class="btn2" onclick="login()" style="width:100%;padding:11px">Sign in</button>
    </div><div id="pcerr" style="color:var(--red);font-size:12px;margin-top:10px"></div></div>`;
  const em=document.getElementById('em');
  em.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('pc').focus(); });
  document.getElementById('pc').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
  em.focus();
}
async function login(){
  const email=document.getElementById('em').value.trim();
  const code=document.getElementById('pc').value;
  if(!email||!email.includes('@')){ document.getElementById('pcerr').textContent='Enter a valid email.'; return; }
  const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,code})});
  if(r.ok){ const d=await r.json(); currentUser=d.email||email; boot(); }
  else {
    let msg='Sign in failed.';
    try{ const d=await r.json(); if(d.error) msg=d.error; }catch(_){}
    document.getElementById('pcerr').textContent=msg;
  }
}
async function doLogout(){
  await fetch('/api/logout',{method:'POST'});
  currentUser=''; showGate();
}
async function checkHealth(){
  try{
    const h = await (await fetch('/api/health')).json();
    const probs = [];
    if(!h.persistent) probs.push(`<b>Data will be lost on the next deploy.</b> The database is on the container's temporary disk (<code>${esc(h.dbPath||'?')}</code>), not a Railway volume. Attach a Volume mounted at <code>/data</code> and set <code>DB_PATH=/data/vi_offline.db</code>.`);
    const bar = $('#warnbar');
    if(probs.length){
      bar.innerHTML = `<span class="msg">${probs.join('<br>')}</span><button class="x" onclick="this.parentNode.classList.remove('on')">&times;</button>`;
      bar.classList.add('on');
    } else bar.classList.remove('on');
  }catch(e){ /* health is advisory only */ }
}
async function boot(){
  checkHealth();
  try{
    const a = await (await fetch('/api/auth')).json();
    if(a.required && !a.ok){ showGate(); return; }
    currentUser = a.email || '';
    await refresh(); render();
  }catch(e){ $('#main').innerHTML='<div class="drop"><h3>Server unreachable</h3><p>'+esc(e.message)+'</p></div>'; }
}
boot();
</script>
